<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototypes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='2' width='12' height='12' rx='3' fill='%233b3631'/%3E%3C/svg%3E">
<style>
  :root { --ink: #2f2b27; --muted: #786f63; --paper: #f6f2e8; --card: #fffdf8; --line: #ddd3c2; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 "Segoe UI", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { margin: 0 0 4px; font-size: 32px; }
  .lede { margin: 0 0 32px; color: var(--muted); }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 32px 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
  .card h3 { margin: 0; font-size: 19px; }
  .card h3 a { color: inherit; text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .card p { margin: 6px 0 10px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .badge, .tag { border-radius: 999px; padding: 1px 10px; border: 1px solid var(--line); background: #f8f4ea; }
  .badge { font-weight: 600; color: var(--ink); }
  .badge.prototype { background: #fff1c7; } .badge.playtested { background: #dff3dc; } .badge.parked { background: #ececec; } .badge.promoted { background: #dbe8fb; } .badge.idea { background: #f6e3f3; }
  .meta a { color: var(--muted); }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Prototypes</h1>
  <p class="lede">Game jam ideas and small experiments. Click a title to play in the browser.</p>
  <div id="list"></div>
</main>
<script src="./prototypes.js"></script>
<script>
  'use strict';
  const REPO = 'https://github.com/fyh828/protos/blob/main/';
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const list = document.getElementById('list');
  const items = (window.PROTOTYPES || []).slice().sort((a, b) => b.created.localeCompare(a.created));
  if (!items.length) list.innerHTML = '<p class="empty">No prototypes yet.</p>';
  const groups = new Map();
  for (const p of items) { if (!groups.has(p.group)) groups.set(p.group, []); groups.get(p.group).push(p); }
  for (const [group, protos] of groups) {
    const h = document.createElement('h2'); h.textContent = group; list.appendChild(h);
    for (const p of protos) {
      const card = document.createElement('article'); card.className = 'card';
      card.innerHTML = `<h3><a href="./${esc(p.path)}">${esc(p.title)}</a></h3>
        <p>${esc(p.pitch)}</p>
        <div class="meta"><span class="badge ${esc(p.status)}">${esc(p.status)}</span><span>${esc(p.created)}</span>
        ${(p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}
        <a href="${REPO}${esc(p.path)}DESIGN.md" target="_blank" rel="noopener">design doc</a></div>`;
      list.appendChild(card);
    }
  }
</script>
</body>
</html>
